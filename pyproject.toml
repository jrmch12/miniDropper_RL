[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minidropper"
version = "0.1.0"
description = "RAPTOR-style many-teacher -> recurrent-student RL controller for the miniDropper thrust-vectoring rocket"
authors = [{name = "Jose Mares", email = "josermch12@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wandb>=0.16.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "ml-collections",
    "mediapy",
    "imageio[ffmpeg]",
    "playground",
    "brax>=0.14.0",
    "jax[cuda12]",
    "mujoco>=3.3.0",
    "mujoco_mjx>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
